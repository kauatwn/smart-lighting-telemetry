[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter

check_tool = clangtidy
check_flags =
    clangtidy: --config-file=.clang-tidy

lib_deps =
    arduino-libraries/ArduinoIoTCloud@^2.1.10
    arduino-libraries/Arduino_ConnectionHandler@^1.3.0
